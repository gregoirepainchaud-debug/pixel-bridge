name: Android

# Modèle « atelier GitHub » de Grégoire : la CI compile à chaque push
# et publie la fin du journal + les erreurs sur la branche ci-logs,
# que Muse lit via raw.githubusercontent (dépôt public).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler et tester
        id: build
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:testDebugUnitTest \
            --console=plain 2>&1 | tee build-full.log
        continue-on-error: true

      - name: Publier le journal sur ci-logs
        if: always()
        run: |
          mkdir -p /tmp/ci-logs
          tail -n 300 build-full.log > "/tmp/ci-logs/build-tail-${GITHUB_RUN_ID}.log" || true
          grep -E "error:|FAILED|e: " build-full.log \
            > "/tmp/ci-logs/errors-${GITHUB_RUN_ID}.txt" || true
          cd /tmp/ci-logs
          git init -q -b ci-logs
          git config user.email "ci@pixel-bridge"
          git config user.name "Pixel Bridge CI"
          git add -A
          git commit -qm "CI run ${GITHUB_RUN_ID} (${{ steps.build.outcome }})"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            ci-logs

      - name: Faire échouer le job si le build a échoué
        if: steps.build.outcome == 'failure'
        run: exit 1
