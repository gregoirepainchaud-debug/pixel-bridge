name: Android

# Modèle « atelier GitHub » de Grégoire : la CI compile à chaque push
# et publie la fin du journal + les erreurs sur la branche ci-logs,
# que Muse lit via raw.githubusercontent (dépôt public).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Installer le NDK épinglé
        run: |
          set -o pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager : $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;26.1.10909125" 2>&1 | tee ndk-install.log

      - name: Compiler et tester
        id: build
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:testDebugUnitTest \
            --console=plain 2>&1 | tee build-full.log
        continue-on-error: true

      - name: Publier l'APK debug en artefact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pixel-bridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publier le journal sur ci-logs
        if: always()
        run: |
          mkdir -p /tmp/ci-logs
          tail -n 300 build-full.log > "/tmp/ci-logs/build-tail-${GITHUB_RUN_ID}.log" || true
          if [ -f ndk-install.log ]; then
            echo "===== INSTALLATION NDK =====" >> "/tmp/ci-logs/build-tail-${GITHUB_RUN_ID}.log"
            tail -n 60 ndk-install.log >> "/tmp/ci-logs/build-tail-${GITHUB_RUN_ID}.log" || true
          fi
          grep -E "error:|FAILED|e: " build-full.log \
            > "/tmp/ci-logs/errors-${GITHUB_RUN_ID}.txt" || true
          cd /tmp/ci-logs
          git init -q -b ci-logs
          git config user.email "ci@pixel-bridge"
          git config user.name "Pixel Bridge CI"
          git add -A
          git commit -qm "CI run ${GITHUB_RUN_ID} (${{ steps.build.outcome }})"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            ci-logs

      - name: Faire échouer le job si le build n'a pas réussi
        if: steps.build.outcome != 'success'
        run: exit 1
