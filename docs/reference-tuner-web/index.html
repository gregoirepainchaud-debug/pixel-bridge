<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tuner Simon</title>
<style>
  :root { --bg:#101418; --panel:#171d23; --line:#2a333d; --txt:#e8edf1; --dim:#8fa0ae;
          --accent:#d9a441; --ok:#2ecc71; --bad:#e74c3c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; /* tue le zoom au double-tap (retour terrain) */ }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--txt);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: 10px 14px 18px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 2px 0 8px; font-weight: 600; }
  h1 .proto { color: var(--accent); font-size: 12px; border:1px solid var(--accent);
    border-radius: 10px; padding: 1px 8px; margin-left: 8px; vertical-align: 2px; }
  .row { display:flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0; }
  label { font-size: 13px; color: var(--dim); }
  select { background: var(--panel); color: var(--txt); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px; font-size: 15px; max-width: 100%; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: var(--panel); color: var(--txt); border: 0; padding: 9px 13px;
    font-size: 15px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #14100a; font-weight: 700; }
  .bigbtn { background: var(--accent); color: #14100a; border: 0; border-radius: 10px;
    padding: 13px 20px; font-size: 17px; font-weight: 700; cursor: pointer; }
  .bigbtn.stop { background: var(--bad); color: #fff; }
  .noteCtl { display:flex; align-items:center; gap:14px; justify-content:center; margin: 6px 0 2px; }
  .stepbtn { width: 62px; height: 62px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); color: var(--txt); font-size: 30px; cursor: pointer; }
  #noteName { font-size: 42px; font-weight: 700; text-align: center; }
  #noteCircle { width: 148px; height: 148px; border: 2px solid var(--line); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
    touch-action: none; cursor: pointer; transition: border-color .15s ease; }
  #noteCircle.pulse { border-color: var(--accent); }
  #noteMeta { text-align:center; color: var(--dim); font-size: 14px; min-height: 20px; }
  #noteBadge { text-align:center; min-height: 20px; font-size: 12.5px; color: var(--accent);
    letter-spacing: .04em; }
  #cents { text-align: center; font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums;
    line-height: 1.05; margin-top: 4px; }
  #cents.ok { color: var(--ok); }
  #cents.uncertain { color: var(--dim); font-size: 26px; font-weight: 500; padding: 14px 0; }
  #barWrap { position: relative; height: 92px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; margin: 10px 0 4px; overflow: hidden; }
  #barCenter { position:absolute; left:50%; top:0; bottom:0; width:2px; background:#3d4a56; }
  .tick { position:absolute; top:0; width:1px; height:14px; background:#46545f; }
  .tickLab { position:absolute; top:16px; transform: translateX(-50%); font-size: 11px; color: var(--dim); }
  #cursor { position:absolute; top: 26px; bottom: 8px; width: 6px; margin-left: -3px;
    background: #fff; border-radius: 3px; left: 50%; opacity: .25; }
  #cursor.ok { background: var(--ok); opacity: 1; }
  #cursor.live { opacity: 1; }
  #diag { color: var(--dim); font-size: 12.5px; line-height: 1.55; margin-top: 10px;
    border-top: 1px solid var(--line); padding-top: 8px; font-variant-numeric: tabular-nums; }
  input[type=range] { accent-color: var(--accent); height: 34px; }
  #err { color: var(--bad); font-size: 14px; min-height: 20px; }
</style>
</head>
<body>
  <h1>Tuner Simon</h1>

  <div class="row">
    <label for="selTuning">Accord</label>
    <select id="selTuning"></select>
    <label>Diapason</label>
    <div class="seg" id="segPitch"></div>
    <label>Mode</label>
    <div class="seg" id="segMode">
      <button data-mode="auto" class="on">Auto</button>
      <button data-mode="demi">Demi-ton</button>
      <button data-mode="bloque">Bloqué</button>
    </div>
  </div>

  <div class="row">
    <button class="bigbtn" id="btnMic">🎙 Activer le micro</button>
    <span id="err"></span>
  </div>

  <div class="noteCtl">
    <button class="stepbtn" id="btnDown" aria-label="demi-ton plus bas">‹</button>
    <div id="noteCircle" title="Glisser : ← → demi-ton · ↑ ↓ octave"><div id="noteName">La4</div></div>
    <button class="stepbtn" id="btnUp" aria-label="demi-ton plus haut">›</button>
  </div>
  <div id="noteBadge"></div>
  <div id="noteMeta">—</div>
  <div class="row" style="justify-content:center">
    <select id="selNote"></select>
  </div>

  <div id="cents" class="uncertain">signal incertain</div>

  <div id="barWrap">
    <div id="barCenter"></div>
    <div id="cursor"></div>
  </div>

  <div class="row">
    <label for="rngSmooth">Réactivité de la barre</label>
    <span style="font-size:12px; color:var(--dim)">lente · stable</span>
    <input type="range" id="rngSmooth" min="0" max="100" step="1" value="73" style="flex:1; min-width:110px">
    <span style="font-size:12px; color:var(--dim)">100 % réactif</span>
  </div>

  <div id="diag">En attente du micro. Active le micro, puis joue une note près du téléphone. Micro demandé sans aucun traitement (ni écho, ni réduction de bruit, ni gain automatique).</div>

<script src="dsp.js"></script>
<script src="app.js"></script>
</body>
</html>
